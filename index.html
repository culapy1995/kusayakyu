<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>草野球マッチ（仮称）プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F1; --surface:#FFFFFF; --ink:#14201B; --ink2:#3F4A45; --muted:#5A6460;
  --line:#E1E4DE; --line2:#CBD0C8; --soft:#EEF0EC;
  --navy:#183B5C; --navy-t:#E5ECF3;
  --orange:#C2410C; --orange-t:#FCEBE2; --orange-ink:#9A3412;
  --green:#1F6A35; --green-t:#E3F1E6;
  --sun:#B42318; --sat:#1D5FA8;
  --num:'Barlow Condensed','Noto Sans JP',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E4E7E1;color:var(--ink);font-family:'Noto Sans JP',system-ui,-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
button[disabled]{cursor:default}
:focus-visible{outline:3px solid #7FA6CC;outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.app.no-tab{padding-bottom:28px}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:10px}
.pad{padding:16px}
.h2{margin:0;font-size:15px;font-weight:900}
.help{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.lbl{font-size:13px;font-weight:700}
.err{margin:0;font-size:12px;font-weight:700;color:var(--sun)}
.req{font-size:11px;font-weight:700;color:var(--orange-ink);margin-left:6px}

/* headers */
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:64px;padding:8px 12px 8px 20px}
.topbar .sub{margin:0;font-size:11px;font-weight:500;color:var(--muted)}
.topbar h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.02em}
.backbar{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:2px;height:56px;padding:0 16px 0 4px}
.backbar h1{margin:0;font-size:17px;font-weight:700}
h1:focus{outline:none}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:22px;display:grid;place-items:center;color:var(--ink)}
.content{padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px}

/* common parts */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.lv-enjoy{background:var(--green-t);color:var(--green)}
.lv-mid{background:var(--navy-t);color:var(--navy)}
.lv-hard{background:var(--orange-t);color:var(--orange-ink)}
.b-soft{background:var(--soft);color:var(--ink2)}
.b-admin{background:var(--navy);color:#fff}
.chip{padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink2)}
.pill-out{flex-shrink:0;height:44px;padding:0 14px 0 10px;border-radius:22px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;font-size:16px;font-weight:900;letter-spacing:.03em;padding:0 16px}
.btn-primary{background:var(--orange);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{background:#fff;color:var(--ink2);border:1px solid var(--line2)}
.btn[disabled]{background:#DADDD6;color:var(--ink2)}
.btn-sm{width:auto;min-height:44px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:700}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--navy-t);color:var(--navy);font-weight:900;font-size:18px;display:grid;place-items:center;flex-shrink:0}
.avatar.lg{width:56px;height:56px;border-radius:28px;font-size:22px}

/* calendar */
.cal{margin:0 16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:4px 10px 10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;height:44px}
.cal-title{display:flex;align-items:baseline;gap:2px;font-weight:700}
.cal-title .n{font-family:var(--num);font-size:24px;line-height:1}
.cal-title .u{font-size:13px;margin-right:4px}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-wd{height:24px;align-items:center;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cal-grid{row-gap:2px}
.day{height:46px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .num{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-family:var(--num);font-size:17px;font-weight:700;color:var(--ink)}
.day.sun .num{color:var(--sun)}
.day.sat .num{color:var(--sat)}
.day.past .num{color:#6B7470}
.day.today .num{box-shadow:inset 0 0 0 1.5px var(--navy)}
.day.sel .num{background:var(--navy);color:#fff;box-shadow:none}
.day .cnt{height:12px;min-width:18px;padding:0 4px;border-radius:6px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;line-height:12px;text-align:center}
.day .cnt.mine{background:var(--navy)}
.day .cnt.none{background:transparent}

/* match list */
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 16px 8px 20px}
.sechead h2{margin:0;font-size:16px;font-weight:900}
.sechead p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.list{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.mcard{display:flex;align-items:center;gap:12px;padding:14px 10px 14px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;width:100%;text-align:left;color:var(--ink)}
.mtime{width:52px;flex-shrink:0;display:flex;flex-direction:column}
.mtime .s{font-family:var(--num);font-size:22px;font-weight:700;line-height:1}
.mtime .e{margin-top:3px;font-size:11px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:8px;min-width:0}
.mname{font-size:15px;font-weight:700}
.vs{flex-shrink:0;font-family:var(--num);font-size:15px;font-weight:700;color:var(--muted)}
.q{width:26px;height:26px;flex-shrink:0;border-radius:13px;border:1.5px dashed var(--orange);color:var(--orange);font-size:14px;font-weight:900;display:grid;place-items:center}
.meta{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.empty{padding:28px 20px;background:#fff;border:1px dashed var(--line2);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.empty b{font-size:14px}

/* match detail */
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:18px}
.hero-top{display:flex;align-items:baseline;justify-content:space-between}
.hero .date{font-family:var(--num);font-size:32px;font-weight:700;line-height:1}
.hero .time{font-family:var(--num);font-size:22px;font-weight:600}
.vsgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;justify-items:center}
.vsgrid .side{display:flex;flex-direction:column;align-items:center;gap:8px}
.emblem{width:60px;height:60px;border-radius:30px;background:#fff;color:var(--navy);font-size:24px;font-weight:900;display:grid;place-items:center}
.emblem.qe{background:transparent;border:2px dashed #fff;color:#fff}
.hero .tname{font-size:12px;font-weight:700;text-align:center;line-height:1.4}
.hero .tname.muted{color:#C9D6E3}
.bigvs{font-family:var(--num);font-size:36px;font-weight:700;letter-spacing:.04em;align-self:center;margin-top:-18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.rows{padding:2px 16px}
.row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--soft)}
.row:last-child{border-bottom:0}
.row svg{flex-shrink:0;margin-top:2px;color:var(--navy)}
.row .k{font-size:11px;font-weight:500;color:var(--muted)}
.row .v{margin-top:2px;font-size:14px;font-weight:700}
.row .ok{margin-top:2px;font-size:12px;font-weight:700;color:var(--green)}
.quote{margin:0;font-size:14px;line-height:1.7}
.status{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px}
.okcircle{width:36px;height:36px;flex-shrink:0;border-radius:18px;background:var(--green-t);color:var(--green);display:grid;place-items:center}

/* sukette */
.toggle{display:flex;align-items:center;gap:10px;min-height:44px;border:0;background:transparent;padding:0;font-size:14px;font-weight:700;color:var(--ink);text-align:left}
.track{width:44px;height:26px;border-radius:13px;background:#B9BFB6;position:relative;flex-shrink:0;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:transform .15s}
.toggle[aria-pressed="true"] .track{background:var(--navy)}
.toggle[aria-pressed="true"] .track::after{transform:translateX(18px)}
.filterbar{padding:0 20px 8px;display:flex;flex-direction:column;gap:2px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rtop{display:flex;align-items:center;gap:12px}
.rname{font-size:16px;font-weight:900}
.rmeta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--navy);font-weight:700}
.rmeta .t{font-family:var(--num);font-size:16px}
.rinfo{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.rbtns{display:flex;flex-wrap:wrap;gap:8px}
.rbtn{min-height:44px;padding:0 10px 0 14px;border-radius:12px;border:0;background:var(--orange);color:#fff;font-size:14px;font-weight:900;display:inline-flex;align-items:center;gap:6px}
.rbtn .fit{font-size:10px;font-weight:700;background:#fff;color:var(--orange-ink);border-radius:5px;padding:1px 5px}
.rbtn.done{background:var(--green-t);color:var(--green);padding:0 14px}
.rbtn.off{background:var(--soft);color:var(--muted);padding:0 14px}
.rbtn.pub{background:var(--navy-t);color:var(--navy);padding:0 14px}

/* apply */
.recbanner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--orange-t);color:var(--orange-ink);font-size:15px}
.recbanner b{font-size:18px;font-weight:900}
.fitline{margin:0;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;line-height:1.5}
.fitline.ok{background:var(--green-t);color:var(--green)}
.fitline.warn{background:var(--orange-t);color:var(--orange-ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.check{display:flex;align-items:flex-start;gap:10px;min-height:44px;font-size:13px;line-height:1.5;padding-top:10px}
.check input{width:20px;height:20px;margin:0;flex-shrink:0;accent-color:var(--navy)}

/* field */
.field{position:relative;width:100%;aspect-ratio:10/9;border-radius:18px;overflow:hidden;background:#3F7D50}
.field svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.pos{position:absolute;transform:translate(-50%,-50%);width:clamp(52px,17%,64px);height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.93);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pos b{font-size:14px;font-weight:900;line-height:1.2;color:var(--ink)}
.pos small{font-size:10px;font-weight:700;line-height:1.2;min-height:12px}
.pos.sel{background:var(--navy);border:2px solid #fff;color:#fff}
.pos.sel b{color:#fff}
.pos.rec{background:#fff;border:2.5px dashed var(--orange)}
.pos.rec small{color:var(--orange-ink)}
.pos.rec.sel{background:var(--orange);border:2px solid #fff}
.pos.rec.sel small,.pos.rec.sel b{color:#fff}
.pos.post{background:var(--orange);border:2px solid #fff;color:#fff}
.pos.post b{color:#fff}
.pos.rec:not(.sel){animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,65,12,.6)}100%{box-shadow:0 0 0 12px rgba(194,65,12,0)}}
@media (prefers-reduced-motion:reduce){.pos.rec:not(.sel){animation:none}}
@media (max-width:359px){
  .field{aspect-ratio:1/1}
  .pos{width:48px;height:44px}
  .pos b{font-size:13px}
  .pad{padding:14px}
}
.field.mini{width:112px;flex-shrink:0;border-radius:12px;aspect-ratio:10/9}
.dot{position:absolute;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.85)}
.dot.on{width:13px;height:13px;background:var(--navy);border:2px solid #fff}
.dot.rec{width:13px;height:13px;background:var(--orange);border:2px solid #fff}
.selsum{margin:0;font-size:13px;color:var(--muted)}
.selsum b{color:var(--ink)}

/* form */
.inp{width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);background:#fff;padding:0 12px;font-size:16px;color:var(--ink)}
textarea.inp{height:auto;padding:12px;line-height:1.6;resize:none}
.inp.bad{border-color:var(--sun);box-shadow:0 0 0 1px var(--sun)}
.seg{display:grid;gap:6px}
.seg button{min-height:44px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:700;color:var(--ink2);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.rolecard{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;cursor:pointer}
.rolecard.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.rolecard input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--navy);flex-shrink:0}
.rolecard b{display:block;font-size:15px}
.rolecard span{display:block;margin-top:4px;font-size:12px;color:var(--muted);line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field-group{display:flex;flex-direction:column;gap:6px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 6px 16px;background:#fff;border:1px solid var(--line);border-radius:14px}
.stepper .ctl{display:flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border:1px solid var(--line2);border-radius:12px;background:#fff;color:var(--ink);display:grid;place-items:center}
.stepper output{min-width:44px;text-align:center;font-size:15px;font-weight:700}
.summary{padding:12px 14px;border-radius:12px;background:var(--navy-t);color:var(--navy);font-size:14px;font-weight:700}

/* onboarding */
.ob-hero{padding:32px 20px 8px}
.ob-logo{width:52px;height:52px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center}
.ob-app{margin:14px 0 2px;font-size:12px;font-weight:700;color:var(--muted)}
.ob-hero h1{margin:0;font-size:26px;font-weight:900}
.ob-lead{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.7}

/* mypage / team */
.unlock{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.unlock li{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px;border-bottom:1px solid var(--soft)}
.unlock li:last-child{border-bottom:0}
.unlock .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.unlock .lk{background:var(--soft);color:var(--muted)}
.unlock .ok{background:var(--green-t);color:var(--green)}
.menu{display:flex;flex-direction:column;gap:10px}
.menuitem{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;width:100%;text-align:left;color:var(--ink)}
.menuitem .mi{width:40px;height:40px;border-radius:12px;background:var(--navy-t);color:var(--navy);display:grid;place-items:center;flex-shrink:0}
.menuitem b{display:block;font-size:15px}
.menuitem span.d{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.count{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--orange);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.teamhero{background:var(--navy);color:#fff;border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px}
.teamhero .emblem{width:56px;height:56px;border-radius:28px;font-size:22px}
.teamhero .n{font-size:18px;font-weight:900}
.teamhero .s{margin-top:4px;font-size:12px;color:#C9D6E3}
.simple{list-style:none;margin:0;padding:0 16px}
.simple li{padding:12px 0;border-bottom:1px solid var(--soft);font-size:13px;line-height:1.6}
.simple li:last-child{border-bottom:0}
.simple .tag{display:inline-block;margin-right:6px}
.sectitle{margin:6px 4px 0;font-size:13px;font-weight:700;color:var(--muted)}
.req-actions{display:flex;gap:8px}

/* tabbar, sheet, toast */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:grid;z-index:20}
.tab{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10px;font-weight:700}
.tab[aria-current="page"]{color:var(--navy)}
.tab .new{position:absolute;top:7px;left:calc(50% + 6px);font-size:9px;font-weight:700;background:var(--orange);color:#fff;border-radius:6px;padding:0 4px;line-height:14px}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(20,32,27,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,440px);max-height:90dvh;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.lockcircle{width:56px;height:56px;border-radius:28px;background:var(--orange-t);color:var(--orange-ink);display:grid;place-items:center;align-self:center}
.sh-title{margin:0;font-size:18px;font-weight:900;line-height:1.5;text-align:center}
.sh-body{margin:0;font-size:14px;line-height:1.7;color:var(--ink2);text-align:center}
.matchup{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:15px;padding:12px;border-radius:12px;background:var(--navy-t);color:var(--navy);flex-wrap:wrap;text-align:center}
.matchup .vs{color:var(--navy)}
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:40;width:min(calc(100% - 32px),408px);pointer-events:none}
body.no-tab #toast-root{bottom:calc(24px + env(safe-area-inset-bottom))}
.toast{background:#14201B;color:#fff;font-size:13px;font-weight:700;line-height:1.5;padding:12px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .2s ease-out}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="sheet-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">このプロトタイプはJavaScriptを有効にすると動きます。</p></noscript>

<script>
(function () {
'use strict';

/* ===== 基本データ ===== */
var POS = {
  P:   { s: '投手', l: '投手',   x: 50, y: 66 },
  C:   { s: '捕手', l: '捕手',   x: 50, y: 90 },

    '<section class="teamhero"><span class="emblem">' + esc(a.team.charAt(0)) + '</span><div class="grow"><div class="n">' + esc(a.team) + '</div><div class="s">' + esc(a.area) + '・' + esc(a.level) + '・管理者：' + esc(S.user.name || 'ゲスト') + '</div></div></section>' +
    '<div class="menu">' +
      '<button type="button" class="menuitem" data-act="go" data-to="postMatch"><span class="mi">' + ic('cal') + '</span><div class="grow"><b>対戦相手を募集する</b><span class="d">日時とグラウンドを決めて公開</span></div>' + ic('chevR') + '</button>' +
      '<button type="button" class="menuitem" data-act="go" data-to="postSukette"><span class="mi">' + ic('userPlus') + '</span><div class="grow"><b>助っ人を募集する</b><span class="d">足りないポジションを球場でタップ</span></div>' + ic('chevR') + '</button>' +
      '<button type="button" class="menuitem" data-act="go" data-to="requests"><span class="mi">' + ic('inbox') + '</span><div class="grow"><b>届いた応募</b><span class="d">助っ人の応募を承認・見送り</span></div>' + (pend ? '<span class="count">' + pend + '</span>' : '') + ic('chevR') + '</button>' +
    '</div>' +
    '<h2 class="sectitle">申し込み中の対戦</h2>' +
    '<section class="card">' + (applied ? '<ul class="simple">' + applied + '</ul>' : '<p class="help pad">まだありません。「試合」タブから申し込めます。</p>') + '</section>' +
    '<h2 class="sectitle">公開中の募集</h2>' +
    '<section class="card">' + (pubs ? '<ul class="simple">' + pubs + '</ul>' : '<p class="help pad">まだありません。</p>') + '</section>' +
  '</div>';
}
function dateOptions(extra) {
  var list = WEEKENDS.slice(0, 16);
  if (extra && list.indexOf(extra) < 0 && extra >= TODAY) list = [extra].concat(list).sort();
  return list.map(function (k) { return { v: k, l: fmtMD(k) }; });
}
function scrPostMatch() {
  var p = S.pm;
  return backbar('対戦相手を募集する') +
  '<div class="content">' +
    '<section class="card pad stack">' +
      '<div class="field-group"><label class="lbl" for="pm-date">日付</label>' + selectHTML('pm-date', 'pm.date', dateOptions(p.date), p.date) + '</div>' +
      '<div class="field-group"><label class="lbl" for="pm-time">時間</label>' + selectHTML('pm-time', 'pm.time', TIMES.map(function (t, i) { return { v: String(i), l: t[0] + '〜' + t[1] }; }), p.time) + '</div>' +
      '<div class="field-group"><label class="lbl" for="pm-ground">グラウンド</label>' + selectHTML('pm-ground', 'pm.ground', GROUNDS.concat([{ v: '', l: '未定（相手と相談して決める）' }]), p.ground) + '</div>' +
      '<div class="field-group"><label class="lbl" for="pm-note">ひとこと（任意）</label><textarea id="pm-note" class="inp" rows="3" data-bind="pm.note" placeholder="例：初対戦のチームさん歓迎です！">' + esc(p.note) + '</textarea></div>' +
    '</section>' +
    '<p class="help">公開すると、カレンダーに「' + esc(S.admin.team) + ' VS ？」として表示されます。</p>' +
    '<button type="button" class="btn btn-primary" data-act="submitPostMatch">募集を公開する</button>' +
  '</div>';
}
function scrPostSukette() {
  var p = S.ps, total = p.sel.size + p.any;
  var labels = KEYS.filter(function (k) { return p.sel.has(k); }).map(function (k) { return POS[k].l; });
  if (p.any) labels.push('ポジション不問' + p.any + '名');
  return backbar('助っ人を募集する') +
  '<div class="content">' +
    '<section class="card pad stack">' +
      '<div class="grid2">' +
        '<div class="field-group"><label class="lbl" for="ps-date">日付</label>' + selectHTML('ps-date', 'ps.date', dateOptions(p.date), p.date) + '</div>' +
        '<div class="field-group"><label class="lbl" for="ps-time">時間</label>' + selectHTML('ps-time', 'ps.time', TIMES.map(function (t) { return t[0] + '〜' + t[1]; }), p.time) + '</div>' +
      '</div>' +
      '<div class="field-group"><label class="lbl" for="ps-ground">グラウンド</label>' + selectHTML('ps-ground', 'ps.ground', GROUNDS, p.ground) + '</div>' +
    '</section>' +
    '<section class="card pad stack">' +
      '<div><h2 class="h2">足りないポジションをタップ</h2><p class="help">もう一度タップで取り消せます。</p></div>' +
      fieldHTML('ps', p.sel, { mode: 'post' }) +
      '<div class="stepper"><div><div style="font-size:14px;font-weight:700">ポジション不問</div><div class="help">どこでも守れる人を募集</div></div>' +
        '<div class="ctl"><button type="button" data-act="psAny" data-val="-1" aria-label="ポジション不問の人数を減らす">' + ic('minus', 18, 2.4) + '</button><output aria-live="polite">' + p.any + '名</output>' +
        '<button type="button" data-act="psAny" data-val="1" aria-label="ポジション不問の人数を増やす">' + ic('plus', 18, 2.4) + '</button></div></div>' +
      '<div class="summary" aria-live="polite">' + (total ? '募集 ' + total + '名：' + labels.join('・') : 'まだ募集するポジションがありません') + '</div>' +
    '</section>' +
    '<section class="card pad stack">' +
      '<div class="field-group"><label class="lbl" for="ps-fee">参加費</label>' + selectHTML('ps-fee', 'ps.fee', ['無料', '500円', '1,000円'], p.fee) + '</div>' +
      '<div class="field-group"><label class="lbl" for="ps-note">ひとこと（任意）</label><textarea id="ps-note" class="inp" rows="3" data-bind="ps.note" placeholder="例：経験は問いません。気軽にどうぞ！">' + esc(p.note) + '</textarea></div>' +
    '</section>' +
    '<button type="button" class="btn btn-primary" data-act="submitPostSukette"' + (total ? '' : ' disabled') + '>募集を公開する</button>' +
  '</div>';
}
function scrRequests() {
  return backbar('届いた応募') +
  '<div class="content">' +
    '<p class="help">助っ人募集に届いた応募です（デモデータ）。</p>' +
    S.requests.map(function (q) {
      var actions = q.status === 'pending'
        ? '<div class="req-actions"><button type="button" class="btn btn-navy btn-sm" style="flex:1" data-act="reqDecide" data-id="' + q.id + '" data-val="ok">承認する</button><button type="button" class="btn btn-ghost btn-sm" style="flex:1" data-act="reqDecide" data-id="' + q.id + '" data-val="ng">見送る</button></div>'
        : '<p class="fitline ' + (q.status === 'ok' ? 'ok' : 'warn') + '">' + (q.status === 'ok' ? '✓ 承認しました。本人に連絡が届きます' : '見送りました') + '</p>';
      return '<section class="card pad stack">' +
        '<div class="rtop"><span class="avatar">' + esc(q.name.charAt(0)) + '</span><div class="grow"><div class="rname">' + esc(q.name) + '</div><div class="help">' + POS[q.pos].l + 'に応募・経験：' + esc(q.level) + '</div></div></div>' +
        '<div style="display:flex;gap:12px;align-items:center">' + miniField(new Set(q.can), null) + '<div class="grow"><div class="help">守れるポジション</div><div style="font-size:14px;font-weight:700">' + posText(new Set(q.can)) + '</div>' + (q.note ? '<p class="quote" style="font-size:13px;margin-top:6px">「' + esc(q.note) + '」</p>' : '') + '</div></div>' +
        actions + '</section>';
    }).join('') +
  '</div>';
}

/* ===== 下のタブ ===== */
function tabbar() {
  var tabs = [['match', '試合', 'cal'], ['sukette', '助っ人', 'userPlus']];
  if (S.admin) tabs.push(['team', 'チーム', 'shield']);
  tabs.push(['mypage', 'マイページ', 'user']);
  return '<nav class="tabbar" aria-label="メインメニュー" style="grid-template-columns:repeat(' + tabs.length + ',minmax(0,1fr))">' +
    tabs.map(function (t) {
      return '<button type="button" class="tab" data-act="tab" data-tab="' + t[0] + '"' + (S.screen === t[0] ? ' aria-current="page"' : '') + '>' + ic(t[2], 22) + t[1] +
        (t[0] === 'team' && S.teamNew ? '<span class="new">NEW</span>' : '') + '</button>';
    }).join('') + '</nav>';
}

/* ===== シート（申し込み制限・確認） ===== */
function renderSheet() {
  var root = document.getElementById('sheet-root');
  if (!S.sheet) { root.innerHTML = ''; return; }
  var html;
  if (S.sheet.type === 'blocked') {
    html = '<div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="sh-t" aria-describedby="sh-b">' +
      '<div class="lockcircle">' + ic('lock', 26) + '</div>' +
      '<h2 id="sh-t" class="sh-title">あなたはチーム管理者ではないため、' + S.sheet.what + 'ができません</h2>' +
      '<p id="sh-b" class="sh-body">この操作は、チーム管理者として登録した人だけができます。管理者として登録すると、このまま続けられます。</p>' +
      '<p class="help center">守れるポジションなど、個人の登録内容はそのまま引き継がれます。</p>' +
      '<button type="button" class="btn btn-navy" data-act="toAdminReg">チーム管理者として登録する</button>' +
      '<button type="button" class="btn btn-ghost" data-act="closeSheet">閉じる</button>' +
    '</div>';
  } else if (S.sheet.type === 'confirmMatch') {
    var m = findMatch(S.matchId), t = teamOf(m.team);
    html = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">' +
      '<h2 id="sh-t" class="sh-title">対戦を申し込む</h2>' +
      '<div class="matchup"><span>' + esc(S.admin.team) + '</span><span class="vs">VS</span><span>' + esc(t.name) + '</span></div>' +
      '<p class="help center">' + fmtMD(m.date) + ' ' + m.start + '〜' + m.end + '</p>' +
      '<label class="lbl" for="cm-msg">相手チームへのメッセージ（任意）</label>' +
      '<textarea id="cm-msg" class="inp" rows="3" data-bind="cm.msg" placeholder="例：よろしくお願いします！当日はユニフォームで伺います。">' + esc(S.cm.msg) + '</textarea>' +
      '<button type="button" class="btn btn-primary" data-act="confirmMatch">申し込む</button>' +
      '<button type="button" class="btn btn-ghost" data-act="closeSheet">やめる</button>' +
    '</div>';
  }
  root.innerHTML = '<div class="scrim" data-act="scrim">' + html + '</div>';
  var f = root.querySelector('.sheet button');
  if (f) f.focus();
}

/* ===== 描画 ===== */
var SCREENS = {
  onboard: scrOnboard, match: scrMatch, matchDetail: scrMatchDetail, sukette: scrSukette, apply: scrApply,
  mypage: scrMypage, posEdit: scrPosEdit, adminReg: scrAdminReg,
  team: scrTeam, postMatch: scrPostMatch, postSukette: scrPostSukette, requests: scrRequests
};
var TABS = ['match', 'sukette', 'team', 'mypage'];
function render(focusSel) {
  var app = document.getElementById('app');
  var isTab = TABS.indexOf(S.screen) >= 0;
  app.classList.toggle('no-tab', !isTab);
  document.body.classList.toggle('no-tab', !isTab);
  app.innerHTML = SCREENS[S.screen]() + (isTab ? tabbar() : '');
  renderSheet();
  renderToast();
  if (S.top) {
    window.scrollTo(0, 0);
    var h = app.querySelector('h1');
    if (h && !S.sheet) h.focus({ preventScroll: true });
    S.top = false;
  } else if (focusSel && !S.sheet) {
    var el = app.querySelector(focusSel);
    if (el) el.focus({ preventScroll: true });
  }
}
var toastTimer;
function toast(msg) {
  S.toast = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { S.toast = null; renderToast(); }, 3000);
}
function renderToast() {
  document.getElementById('toast-root').innerHTML = S.toast ? '<div class="toast">' + esc(S.toast) + '</div>' : '';
}

/* ===== 画面遷移 ===== */
function go(screen) {
  S.history.push({ screen: S.screen, matchId: S.matchId });
  prep(screen);
  S.screen = screen; S.top = true;
}
function back() {
  var prev = S.history.pop();
  S.returnTo = null;
  if (prev) { S.screen = prev.screen; S.matchId = prev.matchId; } else { S.screen = 'match'; }
  S.top = true;
}
function prep(screen) {
  if (screen === 'postMatch') {
    var d = S.selDate >= TODAY ? S.selDate : WEEKENDS[0];
    S.pm = { date: d, time: '0', ground: GROUNDS[0], note: '' };
  } else if (screen === 'postSukette') {
    S.ps = { date: WEEKENDS[0], time: TIMES[1][0] + '〜' + TIMES[1][1], ground: GROUNDS[0], sel: new Set(['SS']), any: 0, fee: '500円', note: '' };
  } else if (screen === 'adminReg') {
    S.ad = { mode: 'new', teamName: '', area: '広島市西区', tlevel: '中級', home: '', code: '', err: {} };
  } else if (screen === 'posEdit') {
    S.pe = { sel: new Set(S.user.positions), level: S.user.level };
  }
}
function ctxSet(ctx) { return { ob: S.ob.sel, ap: S.ap && S.ap.sel, pe: S.pe && S.pe.sel, ps: S.ps && S.ps.sel }[ctx]; }

/* ===== 操作 ===== */
var ACTIONS = {
  tab: function (d) {
    S.screen = d.tab; S.history = []; S.returnTo = null; S.top = true;
    if (d.tab === 'team') S.teamNew = false;
  },
  back: function () { back(); },
  go: function (d) { go(d.to); },
  calMove: function (d) {
    var n = S.cal.y * 12 + S.cal.m + Number(d.val);
    S.cal = { y: Math.floor(n / 12), m: n % 12 };
  },
  pickDay: function (d) { S.selDate = d.date; return '[data-act="pickDay"][data-date="' + d.date + '"]'; },
  openMatch: function (d) { S.matchId = d.id; go('matchDetail'); },
  gate: function (d) {
    if (S.admin) { go(d.to); return; }
    S.sheet = { type: 'blocked', what: d.what, next: { type: 'go', to: d.to } };
  },
  applyMatch: function () {
    if (!S.admin) { S.sheet = { type: 'blocked', what: '申し込み', next: { type: 'sheet', sheet: 'confirmMatch' } }; return; }
    S.cm = { msg: '' };
    S.sheet = { type: 'confirmMatch' };
  },
  confirmMatch: function () {
    S.appliedM[S.matchId] = { msg: S.cm.msg };
    S.sheet = null;
    toast('対戦を申し込みました。相手チームの承認を待ちましょう');
  },
  cancelMatch: function () { delete S.appliedM[S.matchId]; toast('申し込みを取り消しました'); },
  closeSheet: function () { S.sheet = null; },
  scrim: function (d, el, e) { if (e.target === el) S.sheet = null; else return false; },
  toAdminReg: function () {
    S.returnTo = { screen: S.screen, history: S.history.slice(), matchId: S.matchId, next: S.sheet && S.sheet.next };
    var keep = S.returnTo;
    S.sheet = null;
    go('adminReg');
    S.returnTo = keep;
  },
  openAdminReg: function () { S.returnTo = null; go('adminReg'); },
  openApply: function (d) {
    S.ap = { rid: d.rid, pos: d.pos, sel: new Set(S.user.positions), level: S.user.level, note: '', save: true };
    go('apply');
  },
  togglePos: function (d) {
    var set = ctxSet(d.ctx);
    if (set.has(d.pos)) set.delete(d.pos); else set.add(d.pos);
    if (d.ctx === 'ob') S.ob.err.pos = null;
    return '[data-act="togglePos"][data-ctx="' + d.ctx + '"][data-pos="' + d.pos + '"]';
  },
  seg: function (d) {
    var v = d.val;
    if (d.ctx === 'ob') S.ob.level = v;
    else if (d.ctx === 'obt') S.ob.tlevel = v;
    else if (d.ctx === 'ap') S.ap.level = v;
    else if (d.ctx === 'pe') S.pe.level = v;
    else if (d.ctx === 'adt') S.ad.tlevel = v;
    else if (d.ctx === 'adm') { S.ad.mode = v === '新しいチームを登録' ? 'new' : 'invite'; S.ad.err = {}; }
    return '[data-act="seg"][data-ctx="' + d.ctx + '"][data-val="' + v + '"]';
  },
  toggleMine: function () { S.onlyMine = !S.onlyMine; return '[data-act="toggleMine"]'; },
  submitApply: function () {
    var a = S.ap;
    if (!a.sel.size) return;
    S.appliedR[a.rid] = { pos: a.pos, can: Array.from(a.sel), level: a.level, note: a.note };
    if (a.save) { S.user.positions = new Set(a.sel); S.user.level = a.level; }
    back();
    toast((a.pos === 'ANY' ? 'ポジション不問の募集' : POS[a.pos].l) + 'に応募しました');
  },
  submitOnboard: function () {
    var o = S.ob, err = {};
    if (!o.name.trim()) err.name = 'ニックネームを入力してください';
    if (!o.sel.size) err.pos = '守れるポジションを1つ以上選んでください';
    if (o.role === 'admin' && !o.teamName.trim()) err.teamName = 'チーム名を入力してください';
    o.err = err;
    if (Object.keys(err).length) {
      return err.name ? '#ob-name' : err.pos ? '[data-ctx="ob"]' : '#ob-tname';
    }
    S.user = { name: o.name.trim(), positions: new Set(o.sel), level: o.level };
    if (o.role === 'admin') {
      S.admin = { teamId: '__mine', team: o.teamName.trim(), area: o.area, level: o.tlevel, via: 'new' };
    }
    S.screen = 'match'; S.history = []; S.top = true;
    toast(S.admin ? '登録しました。チーム管理者の機能も使えます' : '登録しました。管理者はあとからマイページで追加できます');
  },
  submitAdmin: function () {
    var d = S.ad, err = {};
    if (d.mode === 'new' && !d.teamName.trim()) err.teamName = 'チーム名を入力してください';
    if (d.mode === 'invite' && d.code.trim().length !== 6) err.code = '6文字の招待コードを入力してください';
    d.err = err;
    if (Object.keys(err).length) return d.mode === 'new' ? '#ad-tname' : '#ad-code';
    if (d.mode === 'new') {
      S.admin = { teamId: '__mine', team: d.teamName.trim(), area: d.area, level: d.tlevel, home: d.home, via: 'new' };
    } else {
      S.admin = { teamId: 'kabe', team: TEAMS.kabe.name, area: '広島市安佐北区', level: TEAMS.kabe.level, via: 'invite' };
    }
    S.teamNew = true;
    var r = S.returnTo;
    S.returnTo = null;
    if (r) {
      S.screen = r.screen; S.history = r.history; S.matchId = r.matchId; S.top = true;
      if (r.next && r.next.type === 'sheet') {
        if (isMineTeam(findMatch(S.matchId).team)) { toast('チーム管理者になりました'); return; }
        S.cm = { msg: '' };
        S.sheet = { type: r.next.sheet };
      } else if (r.next && r.next.type === 'go') {
        go(r.next.to);
      }
      toast('チーム管理者になりました。このまま続けられます');
    } else {
      S.screen = 'team'; S.history = []; S.top = true; S.teamNew = false;
      toast('チーム管理者になりました。「チーム」タブが増えました');
    }
  },
  leaveAdmin: function () {
    S.admin = null; S.myMatches = []; S.myRecruits = []; S.appliedM = {};
    S.screen = 'mypage'; S.top = true;
    toast('管理者をやめました（個人の登録は残っています）');
  },
  resetDemo: function () { S = initState(); S.top = true; },
  openPosEdit: function () { go('posEdit'); },
  savePos: function () {
    S.user.positions = new Set(S.pe.sel); S.user.level = S.pe.level;
    back(); toast('守れるポジションを保存しました');
  },
  psAny: function (d) {
    S.ps.any = Math.max(0, Math.min(9, S.ps.any + Number(d.val)));
    return '[data-act="psAny"][data-val="' + d.val + '"]';
  },
  submitPostMatch: function () {
    var p = S.pm, t = TIMES[Number(p.time)];
    S.myMatches.push({ id: 'my' + S.myMatches.length, date: p.date, start: t[0], end: t[1], team: S.admin.teamId === '__mine' ? '__mine' : S.admin.teamId, ground: p.ground || null });
    S.selDate = p.date;
    var pd = parse(p.date); S.cal = { y: pd.getFullYear(), m: pd.getMonth() };
    back();
    toast('対戦相手の募集を公開しました（カレンダーに表示されます）');
  },
  submitPostSukette: function () {
    var p = S.ps;
    if (!p.sel.size && !p.any) return;
    S.myRecruits.push({ id: 'mr' + S.myRecruits.length, team: S.admin.teamId, pos: KEYS.filter(function (k) { return p.sel.has(k); }), any: p.any, date: p.date, time: p.time, ground: p.ground, fee: p.fee });
    back();
    toast('助っ人募集を公開しました（「助っ人」タブに表示されます）');
  },
  reqDecide: function (d) {
    S.requests.forEach(function (q) { if (q.id === d.id) q.status = d.val; });
  }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  var res = fn(el.dataset, el, e);
  if (res === false) return;
  render(typeof res === 'string' ? res : null);
});
function onBind(e) {
  var el = e.target, b = el.dataset && el.dataset.bind;
  if (!b) return;
  if (el.type === 'radio' && !el.checked) return;
  var parts = b.split('.');
  var obj = S[parts[0]];
  if (!obj) return;
  obj[parts[1]] = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.rerender && e.type === 'change') render('input[name="' + el.name + '"][value="' + el.value + '"]');
}
document.addEventListener('input', onBind);
document.addEventListener('change', onBind);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); }
});

S = initState();
render();
})();
